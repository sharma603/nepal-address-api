<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nepal Address Selector</title>
  <link rel="stylesheet" href="./selector.css">
  <script src="./selector.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Address Selector</h1>
    <p class="intro">7 provinces · 77 districts · 753 local levels</p>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <button id="retry" class="secondary" type="button" hidden>Retry</button>
    <form id="addressForm">
      <div class="form-group">
        <label for="province">1. Select Province</label>
        <input id="provinceSearch" class="search" type="search" aria-label="Search provinces" placeholder="Search in English or नेपाली" disabled>
        <select id="province" required disabled><option value="">Loading provinces…</option></select>
      </div>
      <div class="form-group">
        <label for="district">2. Select District</label>
        <input id="districtSearch" class="search" type="search" aria-label="Search districts" placeholder="Search in English or नेपाली" disabled>
        <select id="district" required disabled><option value="">Choose District…</option></select>
      </div>
      <div class="form-group">
        <label for="municipality">3. Municipality / Rural Municipality</label>
        <input id="municipalitySearch" class="search" type="search" aria-label="Search municipalities" placeholder="Search in English or नेपाली" disabled>
        <select id="municipality" required disabled><option value="">Choose Municipality…</option></select>
      </div>
      <div class="form-group">
        <label for="ward">4. Select Ward</label>
        <input id="wardSearch" class="search" type="search" aria-label="Search wards" placeholder="Search ward number / वडा नम्बर" disabled>
        <select id="ward" required disabled><option value="">Choose Ward…</option></select>
      </div>
      <div class="form-group">
        <label for="village">5. Village / Tole</label>
        <input id="village" list="villageSuggestions" maxlength="120" autocomplete="off" placeholder="Choose a suggestion or type your village / tole" disabled aria-describedby="villageHelp villageError">
        <datalist id="villageSuggestions"></datalist>
        <p id="villageHelp" class="help">Select a ward to enter a village / tole.</p>
        <p id="villageError" class="error" role="alert"></p>
        <button id="saveVillage" type="button" class="secondary" disabled>Save suggestion</button>
      </div>
      <div id="selectionResult" class="result" hidden>
        <strong>Full address</strong>
        <output id="finalText" aria-live="polite"></output>
      </div>
    </form>
    <p class="coverage">Village / tole coverage is incomplete. You can enter your own name; saved suggestions stay in this browser and are not verified official data.</p>
    <a class="source-link" href="./DATA_SOURCES.md">Data sources and coverage notes</a>
  </main>
</body>
</html>
